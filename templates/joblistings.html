<!-- HTML file for joblistings page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job listings page</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    {%include "components/navbar.html"%} {% for job in jobs %}
    <h2>{{job.job_title}}</h2>
    <h4>{{job.employer_name}}</h4>
    <img src="{{job.employer_logo}}" alt="Company logo" />
    <p>{{job.job_location}}</p>
    <p>{{job.job_posted_at}}</p>
    <p>{{job.job_publisher}}</p>
    {% endfor %}
  </body>
</html>
